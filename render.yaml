services:
  - type: web
    name: clinic-booking-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
